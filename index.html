<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>小小求职拿下 ✦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      --purple-deep: #3b0764;
      --purple-dark: #4c1d95;
      --purple-mid: #6b35c7;
      --purple-light: #9d7ab8;
      --purple-muted: #a07cc0;
      --purple-faint: #b09ac8;
      --pink-primary: #c084fc;
      --pink-accent: #f472b6;
      --gradient-btn: linear-gradient(135deg, #c084fc, #f472b6);
      --gradient-bg: linear-gradient(135deg, #f0e8ff 0%, #fce8f5 50%, #ffe8f0 100%);
      --card-bg: rgba(255,255,255,0.82);
      --card-shadow: 0 8px 32px rgba(180,120,255,0.14), 0 2px 8px rgba(180,120,255,0.07);
      --card-border: 1px solid rgba(255,255,255,0.9);
      --radius-card: 24px;
      --radius-btn: 9999px;
    }

    body {
      font-family: var(--font-main);
      background: var(--gradient-bg);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--purple-dark);
      -webkit-font-smoothing: antialiased;
    }

    /* Top Nav */
    .top-nav {
      position: sticky; top: 0; z-index: 40;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.55);
      padding: 0 24px;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 56px;
    }
    .nav-logo {
      font-size: 14px; font-weight: 700; letter-spacing: 0.5px;
      background: linear-gradient(90deg, #b06fd8, #e87bac);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .nav-tabs { display: flex; gap: 4px; }
    .nav-tab {
      padding: 6px 16px; border-radius: var(--radius-btn);
      font-size: 14px; text-decoration: none; color: #a78bca;
      transition: all 0.2s; font-weight: 500;
    }
    .nav-tab:hover { background: rgba(192,132,252,0.08); }
    .nav-tab.active { background: rgba(192,132,252,0.15); color: #7c3aed; font-weight: 600; }
    .nav-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--gradient-btn);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 13px; font-weight: 700;
      box-shadow: 0 2px 8px rgba(192,132,252,0.3);
      cursor: pointer; transition: all 0.2s;
      border: none;
    }
    .nav-avatar:hover { transform: scale(1.1); box-shadow: 0 4px 14px rgba(192,132,252,0.45); }

    /* Main Content */
    .main-content {
      max-width: 1200px; margin: 0 auto;
      padding: 32px 24px;
    }

    /* Greeting */
    .greeting h1 {
      font-size: 28px; font-weight: 800; color: var(--purple-deep);
    }
    .greeting p {
      font-size: 14px; color: var(--purple-light); margin-top: 4px;
    }

    /* Status Card */
    .status-card {
      margin-top: 24px; border-radius: var(--radius-card); padding: 24px;
      position: relative; overflow: hidden;
      background: var(--card-bg); box-shadow: var(--card-shadow);
      border: var(--card-border);
    }
    .status-bar {
      position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px;
      border-radius: 4px; background: var(--gradient-btn);
    }
    .status-inner { padding-left: 16px; }
    .status-icon { font-size: 28px; }
    .status-title { font-size: 16px; font-weight: 700; color: var(--purple-dark); margin-top: 8px; }
    .status-sub { font-size: 13px; color: var(--purple-light); margin-top: 4px; }
    .status-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-primary {
      padding: 10px 24px; border-radius: var(--radius-btn); border: none;
      background: var(--gradient-btn); color: white;
      font-size: 14px; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 16px rgba(192,132,252,0.4);
      transition: all 0.2s;
    }
    .btn-primary:hover { transform: scale(1.05); }
    .btn-secondary {
      padding: 10px 24px; border-radius: var(--radius-btn);
      border: 1px solid rgba(192,132,252,0.3);
      background: rgba(192,132,252,0.12); color: #7c3aed;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover { transform: scale(1.05); }

    /* Tool Grid */
    .tool-section { margin-top: 32px; }
    .tool-section h3 { font-size: 14px; font-weight: 700; color: var(--purple-mid); margin-bottom: 16px; }
    .tool-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .tool-card {
      border-radius: var(--radius-card); padding: 24px; position: relative;
      overflow: hidden; transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(180,120,255,0.12);
      border: 1px solid rgba(255,255,255,0.9);
    }
    .tool-card:hover { transform: translateY(-4px); }
    .tool-card.locked { opacity: 0.6; }
    .tool-card .lock-badge {
      position: absolute; top: 12px; right: 12px;
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(192,132,252,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
    }
    .tool-card .emoji { font-size: 28px; margin-bottom: 12px; }
    .tool-card .locked-label { font-size: 10px; font-weight: 600; color: var(--pink-primary); margin-bottom: 4px; }
    .tool-card h4 { font-size: 14px; font-weight: 700; color: var(--purple-dark); margin-bottom: 6px; }
    .tool-card p { font-size: 12px; color: #7c5da8; line-height: 1.5; margin-bottom: 16px; }
    .tool-card .tool-btn {
      font-size: 12px; font-weight: 700; padding: 8px 16px;
      border-radius: var(--radius-btn); border: none;
      background: var(--gradient-btn); color: white; cursor: pointer;
      box-shadow: 0 4px 12px rgba(192,132,252,0.35);
      transition: all 0.2s;
    }
    .tool-card .tool-btn:hover { transform: scale(1.05); }
    .tool-card .tool-locked-text { font-size: 12px; color: var(--purple-faint); }
    .tool-card-1 { background: linear-gradient(135deg, #f5eeff, #fce7f3); }
    .tool-card-2 { background: linear-gradient(135deg, #eef2ff, #f5eeff); }
    .tool-card-3 { background: linear-gradient(135deg, #ecfdf5, #eef2ff); }
    .tool-card-4 { background: linear-gradient(135deg, #fff7ed, #fce7f3); }

    /* Resume Bar */
    .resume-bar {
      margin-top: 32px; border-radius: var(--radius-card);
      padding: 16px 24px; display: flex; align-items: center; gap: 24px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(192,132,252,0.18);
      box-shadow: 0 4px 20px rgba(180,120,255,0.10);
    }
    .resume-bar-label { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
    .resume-bar-label .icon { font-size: 18px; }
    .resume-bar-label .text strong { font-size: 14px; color: var(--purple-dark); display: block; }
    .resume-bar-label .text span { font-size: 12px; color: var(--purple-muted); }
    .resume-chips { flex: 1; display: flex; gap: 8px; flex-wrap: wrap; }
    .resume-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: var(--radius-btn);
      font-size: 12px; font-weight: 500; color: var(--purple-mid);
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(192,132,252,0.15);
    }
    .resume-chip.active {
      background: linear-gradient(135deg, rgba(192,132,252,0.15), rgba(244,114,182,0.15));
      border: 1px solid rgba(192,132,252,0.35);
    }
    .resume-chip .dot { color: var(--pink-primary); }
    .upload-btn {
      flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: var(--radius-btn); border: none;
      background: var(--gradient-btn); color: white;
      font-size: 14px; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 16px rgba(192,132,252,0.35);
      transition: all 0.2s;
    }
    .upload-btn:hover { transform: scale(1.05); }
    .empty-text { font-size: 12px; color: var(--purple-faint); }

    /* Responsive */
    @media (max-width: 900px) {
      .tool-grid { grid-template-columns: repeat(2, 1fr); }
      .resume-bar { flex-direction: column; align-items: flex-start; }
    }
    @media (max-width: 560px) {
      .tool-grid { grid-template-columns: 1fr; }
      .nav-tabs { display: none; }
    }

    /* ========== 冷启动引导样式 ========== */
    .ob-overlay { position: fixed; inset: 0; z-index: 99999; opacity: 0; transition: opacity 0.5s ease; overflow: hidden; }
    .ob-overlay.ob-visible { opacity: 1; }
    .ob-overlay.ob-hiding { opacity: 0; pointer-events: none; }
    .ob-iframe { width: 100%; height: 100%; border: none; }

    /* Profile setup */
    .ob-profile { max-width: 520px; width: 92%; background: white; border-radius: 28px; padding: 48px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; gap: 20px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-height: 90vh; overflow-y: auto; }
    .ob-avatar-preview { width: 90px; height: 90px; border-radius: 50%; background: #f5f0fa; border: 3px solid #e8dff0; display: flex; align-items: center; justify-content: center; font-size: 42px; }
    .ob-profile-title { font-size: 22px; font-weight: 800; color: #1a1a1a; }
    .ob-profile-subtitle { font-size: 14px; color: #888; margin-top: -12px; }
    .ob-section-label { font-size: 13px; font-weight: 700; color: #555; align-self: flex-start; margin-top: 4px; }
    .ob-gender-row { display: flex; gap: 12px; width: 100%; }
    .ob-gender-option { flex: 1; padding: 14px; border: 2px solid #eee; border-radius: 14px; text-align: center; cursor: pointer; font-size: 15px; font-weight: 600; color: #555; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .ob-gender-option span { font-size: 22px; }
    .ob-gender-option:hover { border-color: #c084fc; background: #faf5ff; }
    .ob-gender-active { border-color: #c084fc !important; background: #f3e8ff !important; color: #7c3aed !important; }
    .ob-avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; width: 100%; }
    .ob-avatar-option { width: 52px; height: 52px; border-radius: 14px; border: 2px solid #eee; background: white; font-size: 28px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
    .ob-avatar-option:hover { border-color: #c084fc; background: #faf5ff; transform: scale(1.1); }
    .ob-avatar-active { border-color: #c084fc !important; background: #f3e8ff !important; transform: scale(1.1); }
    .ob-nickname-input { width: 100%; padding: 16px 20px; border: 2px solid #eee; border-radius: 14px; font-size: 17px; text-align: center; outline: none; transition: border-color 0.3s; }
    .ob-nickname-input:focus { border-color: #c084fc; }
    .ob-nickname-input::placeholder { color: #ccc; }
    .ob-identity-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .ob-identity-option { padding: 14px 18px; border: 2px solid #eee; border-radius: 14px; cursor: pointer; font-size: 15px; font-weight: 600; color: #555; transition: all 0.2s; text-align: center; }
    .ob-identity-option:hover { border-color: #c084fc; background: #faf5ff; }
    .ob-identity-active { border-color: #c084fc !important; background: #f3e8ff !important; color: #7c3aed !important; }
    .ob-finish-btn { width: 100%; padding: 16px; border: none; border-radius: 14px; background: linear-gradient(135deg, #c084fc, #f472b6); color: white; font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 16px rgba(192,132,252,0.3); margin-top: 8px; }
    .ob-finish-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(192,132,252,0.4); }
    .ob-btn-disabled { background: #ddd !important; color: #999 !important; cursor: not-allowed !important; box-shadow: none !important; transform: none !important; }
    /* ========== 结束：冷启动引导样式 ========== */

    /* ========== 弹窗 Modal 样式 ========== */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(60, 30, 90, 0.45);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      justify-content: center; align-items: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-box {
      background: rgba(255,255,255,0.95);
      border-radius: 24px; padding: 32px;
      max-width: 720px; width: 100%;
      max-height: 85vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(180,120,255,0.3);
      border: 1px solid rgba(255,255,255,0.9);
      position: relative;
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 36px; height: 36px; border: none; cursor: pointer;
      border-radius: 50%; background: rgba(192,132,252,0.1);
      color: var(--purple-mid); font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .modal-close:hover { background: rgba(192,132,252,0.2); transform: rotate(90deg); }
    .modal-title {
      font-size: 22px; font-weight: 800; color: var(--purple-deep);
      margin-bottom: 6px;
    }
    .modal-subtitle {
      font-size: 13px; color: var(--purple-light);
      margin-bottom: 24px;
    }
    .modal-empty {
      text-align: center; padding: 40px 20px;
      color: var(--purple-faint); font-size: 14px;
    }

    /* 诊断报告弹窗 */
    .diag-score-card {
      display: flex; align-items: center; gap: 20px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(192,132,252,0.1), rgba(244,114,182,0.1));
      border-radius: 16px; margin-bottom: 20px;
    }
    .diag-score-num {
      font-size: 48px; font-weight: 900;
      background: var(--gradient-btn);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .diag-score-info { flex: 1; }
    .diag-score-info strong { font-size: 14px; color: var(--purple-mid); display: block; }
    .diag-score-info span { font-size: 13px; color: var(--purple-light); }
    .diag-section h4 {
      font-size: 14px; font-weight: 700; color: var(--purple-mid);
      margin: 16px 0 10px;
    }
    .diag-item-card {
      padding: 12px 16px; margin-bottom: 8px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(192,132,252,0.15);
      border-radius: 12px; font-size: 13px; line-height: 1.6;
    }
    .diag-item-orig { color: #c44569; text-decoration: line-through; margin-bottom: 4px; }
    .diag-item-sugg { color: #16a34a; font-weight: 600; }

    /* 岗位推荐弹窗 */
    .job-modal-card { padding: 16px; margin-bottom: 12px; background: rgba(255,255,255,0.7); border: 1px solid rgba(192,132,252,0.15); border-radius: 16px; transition: all 0.2s; }
    .job-modal-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(192,132,252,0.2); border-color: rgba(192,132,252,0.4); }
    .job-modal-card:hover .job-modal-title { text-decoration-color: var(--pink-primary) !important; }
    .job-modal-head { display: flex; justify-content: space-between; align-items: start; margin-bottom: 6px; }
    .job-modal-title { font-size: 15px; font-weight: 700; color: var(--purple-deep); }
    .job-modal-industry { font-size: 12px; color: var(--purple-light); margin-top: 2px; }
    .job-modal-match {
      font-size: 11px; font-weight: 700; padding: 4px 10px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(192,132,252,0.2), rgba(244,114,182,0.2));
      color: var(--purple-mid);
    }
    .job-modal-reason { font-size: 12px; color: var(--purple-mid); margin-top: 8px; line-height: 1.6; }
    .job-modal-meta { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: var(--purple-light); }
    .job-modal-salary { font-weight: 700; color: var(--pink-primary); font-size: 13px; }

    /* 技能标签 */
    .skill-tag {
      display: inline-block; padding: 4px 12px; margin: 3px;
      background: rgba(192,132,252,0.12);
      border: 1px solid rgba(192,132,252,0.25);
      border-radius: 999px; font-size: 12px;
      color: var(--purple-mid); font-weight: 500;
    }
    /* ========== 结束：弹窗 Modal 样式 ========== */

    /* ========== 个人中心样式 ========== */
    .profile-header {
      display: flex; align-items: center; gap: 16px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(192,132,252,0.12), rgba(244,114,182,0.12));
      border-radius: 16px; margin-bottom: 24px;
    }
    .profile-avatar-big {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--gradient-btn);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 28px; font-weight: 700;
      box-shadow: 0 6px 20px rgba(192,132,252,0.35);
      flex-shrink: 0;
    }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name {
      font-size: 18px; font-weight: 800; color: var(--purple-deep);
      margin-bottom: 4px;
    }
    .profile-meta {
      font-size: 12px; color: var(--purple-light);
    }
    .profile-edit-btn {
      padding: 6px 14px; border-radius: 999px; border: none;
      background: rgba(255,255,255,0.7);
      color: var(--purple-mid); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .profile-edit-btn:hover { background: white; transform: scale(1.05); }

    /* 简历管理列表 */
    .pm-section-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .pm-section-title {
      font-size: 14px; font-weight: 700; color: var(--purple-mid);
    }
    .pm-upload-btn {
      padding: 6px 14px; border-radius: 999px; border: none;
      background: var(--gradient-btn); color: white;
      font-size: 12px; font-weight: 600; cursor: pointer;
      box-shadow: 0 2px 8px rgba(192,132,252,0.3);
      transition: all 0.2s;
    }
    .pm-upload-btn:hover { transform: scale(1.05); }
    .pm-resume-list {
      display: flex; flex-direction: column; gap: 10px;
    }
    .pm-resume-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-radius: 14px;
      background: rgba(255,255,255,0.7);
      border: 1.5px solid rgba(192,132,252,0.15);
      transition: all 0.2s; cursor: pointer;
    }
    .pm-resume-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(192,132,252,0.15);
    }
    .pm-resume-item.active {
      background: linear-gradient(135deg, rgba(192,132,252,0.12), rgba(244,114,182,0.1));
      border-color: rgba(192,132,252,0.45);
    }
    .pm-resume-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, rgba(192,132,252,0.18), rgba(244,114,182,0.18));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .pm-resume-meta { flex: 1; min-width: 0; }
    .pm-resume-name {
      font-size: 14px; font-weight: 700; color: var(--purple-deep);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .pm-resume-info {
      font-size: 11px; color: var(--purple-light);
      display: flex; gap: 8px; align-items: center;
    }
    .pm-resume-badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 10px; flex-shrink: 0;
    }
    .pm-badge-active { background: var(--gradient-btn); color: white; }
    .pm-badge-parsed { background: rgba(34,197,94,0.15); color: #16a34a; }
    .pm-badge-pending { background: rgba(245,158,11,0.15); color: #d97706; }
    .pm-resume-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .pm-icon-btn {
      width: 32px; height: 32px; border: none; border-radius: 50%;
      background: transparent; color: var(--purple-light);
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .pm-icon-btn:hover { background: rgba(192,132,252,0.12); color: var(--purple-mid); }
    .pm-icon-btn.danger:hover { background: rgba(239,68,68,0.12); color: #dc2626; }
    .pm-empty-resume {
      text-align: center; padding: 30px 20px;
      background: rgba(255,255,255,0.5);
      border: 2px dashed rgba(192,132,252,0.3);
      border-radius: 14px; color: var(--purple-light); font-size: 13px;
    }
    /* ========== 结束：个人中心样式 ========== */
  </style>
</head>
<body>

<!-- Top Navigation -->
<nav class="top-nav">
  <div class="nav-inner">
    <span class="nav-logo">✦ 小小求职拿下</span>
    <div class="nav-tabs">
      <a href="#" class="nav-tab active">首页</a>
      <a href="#" class="nav-tab" onclick="navigateTo('jobs')">岗位</a>
      <a href="#" class="nav-tab" onclick="navigateTo('interview')">面试</a>
      <a href="#" class="nav-tab" onclick="navigateTo('applications')">追踪</a>
      <a href="#" class="nav-tab" onclick="navigateTo('chat')">助手</a>

<!-- Main Content -->
<main class="main-content main-area">

  <!-- Greeting -->
  <div class="greeting">
    <h1 id="greetingText">Hi 👋</h1>
    <p>今天也要元气满满地求职哦～</p>
  </div>

  <!-- Status Card -->
  <div class="status-card" id="statusCard">
    <div class="status-bar"></div>
    <div class="status-inner">
      <div class="status-icon">🚀</div>
      <div class="status-title">你好！先上传你的简历</div>
      <div class="status-sub">上传简历后，AI 会帮你解析并推荐匹配岗位</div>
      <div class="status-actions">
        <input type="file" accept=".pdf,.docx,.txt,.doc" style="display:none" id="uploadInput" />
        <button type="button" class="btn-primary" onclick="document.getElementById('uploadInput').click()">📄 上传简历</button>
      </div>
    </div>
  </div>

  <!-- Tool Grid -->
  <div class="tool-section">
    <h3>求职工具箱</h3>
    <div class="tool-grid" id="toolGrid">
      <div class="tool-card tool-card-1">
        <div class="emoji">📄</div>
        <h4>简历诊断</h4>
        <p>AI 找出简历亮点与改进空间，让你脱颖而出</p>
        <button class="tool-btn" onclick="navigateTo('diagnosis')">开始诊断</button>
      </div>
      <div class="tool-card tool-card-2 locked" id="toolJobs">
        <div class="lock-badge">🔒</div>
        <div class="emoji">🎯</div>
        <div class="locked-label">待解锁</div>
        <h4>岗位推荐</h4>
        <p>解析简历后为你精准匹配最合适的岗位</p>
        <div class="tool-locked-text">解析简历后为你解锁</div>
      </div>
      <div class="tool-card tool-card-3 locked" id="toolInterview">
        <div class="lock-badge">🔒</div>
        <div class="emoji">🎤</div>
        <div class="locked-label">待解锁</div>
        <h4>模拟面试</h4>
        <p>AI 面试官帮你练习，告别面试紧张</p>
        <div class="tool-locked-text">解析简历后为你解锁</div>
      </div>
      <div class="tool-card tool-card-4 locked" id="toolTracking">
        <div class="lock-badge">🔒</div>
        <div class="emoji">📊</div>
        <div class="locked-label">待解锁</div>
        <h4>投递追踪</h4>
        <p>可视化追踪所有投递进展，不漏掉任何机会</p>
        <div class="tool-locked-text">解析简历后为你解锁</div>
      </div>
    </div>
  </div>

  <!-- Resume Bar moved to Profile Center (click avatar to access) -->

</main>

<!-- 弹窗 Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-title" id="modalTitle">标题</div>
    <div class="modal-subtitle" id="modalSubtitle">副标题</div>
    <div id="modalContent"></div>
  </div>
</div>

<script src="./config.js"></script>
<script>
  const DEFAULT_API_BASE_URL = "http://127.0.0.1:8000";
  const API_BASE_URL = (window.APP_CONFIG?.API_BASE_URL || DEFAULT_API_BASE_URL).replace(/\/+$/, "");

  // ========== API 客户端（数据库同步） ==========
  const Api = {
    async json(url, opts = {}) {
      const res = await fetch(`${API_BASE_URL}${url}`, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
      });
      if (!res.ok) throw new Error(`API ${url} 失败：${res.status}`);
      return res.status === 204 ? null : res.json();
    },
    createUser(profile) {
      return this.json('/users', { method: 'POST', body: JSON.stringify(profile) });
    },
    updateUser(id, profile) {
      return this.json(`/users/${id}`, { method: 'PUT', body: JSON.stringify(profile) });
    },
    listResumes(userId) {
      return this.json(`/resumes?user_id=${encodeURIComponent(userId)}`);
    },
    createResume(data) {
      return this.json('/resumes', { method: 'POST', body: JSON.stringify(data) });
    },
    getResume(id) {
      return this.json(`/resumes/${id}`);
    },
    setActiveResume(id, userId) {
      return this.json(`/resumes/${id}/active`, { method: 'PUT', body: JSON.stringify({ user_id: userId }) });
    },
    deleteResume(id) {
      return this.json(`/resumes/${id}`, { method: 'DELETE' });
    },
  };

  // 保证用户在数据库中存在，返回 user_id
  async function ensureUser() {
    const profile = JSON.parse(localStorage.getItem('userProfile') || '{}');
    if (profile.user_id) return profile.user_id;
    if (!profile.nickname) return null; // 还没完成冷启动
    try {
      const created = await Api.createUser({
        nickname: profile.nickname || '',
        avatar: profile.avatar || '',
        gender: profile.gender || '',
        identity: profile.identity || '',
        mbti: profile.mbti || '',
      });
      profile.user_id = created.id;
      localStorage.setItem('userProfile', JSON.stringify(profile));
      return created.id;
    } catch (e) {
      console.warn('[ensureUser] 数据库不可用，仅用本地存储', e);
      return null;
    }
  }

  // 从数据库加载简历列表（替换 localStorage 中的列表）
  async function syncResumesFromDb() {
    const userId = await ensureUser();
    if (!userId) return; // 数据库不可用
    try {
      const list = await Api.listResumes(userId);
      // 转换成前端格式
      const local = list.map(r => ({
        id: r.id,
        fileName: r.file_name,
        name: r.file_name?.replace(/\.[^.]+$/, ''),
        fileSize: r.file_size || 0,
        uploadTime: new Date(r.created_at).getTime(),
        parsed: r.parse_status === 'parsed',
        parseResult: { parsed_data: r.parsed_data || {} },
        is_active: r.is_active,
      }));
      localStorage.setItem('resumes', JSON.stringify(local));
      const active = local.find(r => r.is_active);
      if (active) localStorage.setItem('activeResumeId', active.id);
    } catch (e) {
      console.warn('[syncResumesFromDb] 失败，使用本地缓存', e);
    }
  }

  // Load user profile
  const profile = JSON.parse(localStorage.getItem('userProfile') || '{}');
  if (profile.nickname) {
    document.getElementById('greetingText').textContent = `Hi，${profile.nickname} 👋`;
    document.getElementById('navAvatar').textContent = profile.nickname[0].toUpperCase();
  }

  // Load resumes - now updates Profile Modal if open, plus tools unlock state
  function loadResumes() {
    const resumes = JSON.parse(localStorage.getItem('resumes') || '[]');

    // Refresh profile modal content if it's open
    if (document.getElementById('modalOverlay')?.classList.contains('active')) {
      const title = document.getElementById('modalTitle')?.textContent || '';
      if (title.includes('个人中心')) showProfileModal();
    }

    // Unlock tools if any resume is parsed
    const hasParsed = resumes.some(r => r.parsed);
    if (hasParsed) unlockTools();
  }

  function unlockTools() {
    ['toolJobs', 'toolInterview', 'toolTracking'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('locked');
      const lock = el.querySelector('.lock-badge');
      const label = el.querySelector('.locked-label');
      const lockedText = el.querySelector('.tool-locked-text');
      if (lock) lock.remove();
      if (label) label.remove();
      if (lockedText) {
        const btn = document.createElement('button');
        btn.className = 'tool-btn';
        btn.textContent = id === 'toolJobs' ? '查看推荐' : id === 'toolInterview' ? '开始练习' : '查看追踪';
        btn.onclick = () => navigateTo(id.replace('tool', '').toLowerCase());
        lockedText.replaceWith(btn);
      }
    });

    // Update status card
    updateStatusCard();
  }

  function updateStatusCard() {
    const resumes = JSON.parse(localStorage.getItem('resumes') || '[]');
    const activeId = localStorage.getItem('activeResumeId');
    const active = resumes.find(r => r.id === activeId);
    const hasParsed = active ? active.parsed : resumes.some(r => r.parsed);
    const hasUploaded = resumes.length > 0;
    const card = document.getElementById('statusCard');
    if (!card) return;

    if (hasParsed && active) {
      // 显示当前活跃简历的解析摘要
      const data = active.parseResult?.parsed_data || {};
      const score = data.resume_diagnosis?.overall_score;
      const summary = data.candidate_summary || '';
      const skills = data.extracted_skills || [];

      card.querySelector('.status-icon').textContent = '🎯';
      card.querySelector('.status-title').textContent = `当前简历：${active.fileName || active.name || '简历'}`;
      let subText = '';
      if (score) subText += `综合评分 ${score} 分`;
      if (summary) subText += (subText ? ' · ' : '') + summary;
      else if (skills.length) subText += (subText ? ' · ' : '') + `技能：${skills.slice(0, 5).join('、')}`;
      card.querySelector('.status-sub').textContent = subText || '解析完成，去查看详情';
      card.querySelector('.status-actions').innerHTML = `
        <button class="btn-primary" onclick="navigateTo('jobs')">查看岗位推荐 →</button>
        <button class="btn-secondary" onclick="navigateTo('diagnosis')">查看诊断报告</button>
      `;
    } else if (hasUploaded) {
      card.querySelector('.status-icon').textContent = '✨';
      card.querySelector('.status-title').textContent = '简历已上传，开始 AI 解析吧';
      card.querySelector('.status-sub').textContent = '解析完成后即可获得精准岗位推荐和面试准备建议';
      card.querySelector('.status-actions').innerHTML = `
        <button class="btn-primary" onclick="parseResume()">开始 AI 解析 ✨</button>
      `;
    } else {
      // 初始状态
      card.querySelector('.status-icon').textContent = '🚀';
      card.querySelector('.status-title').textContent = '你好！先上传你的简历';
      card.querySelector('.status-sub').textContent = '上传简历后，AI 会帮你解析并推荐匹配岗位';
      card.querySelector('.status-actions').innerHTML = `
        <input type="file" accept=".pdf,.docx,.txt,.doc" style="display:none" id="uploadInput" />
        <button type="button" class="btn-primary" onclick="document.getElementById('uploadInput').click()">📄 上传简历</button>
      `;
      bindUploadInput('uploadInput');
    }
  }

  function navigateTo(page) {
    const resumes = JSON.parse(localStorage.getItem('resumes') || '[]');
    const activeId = localStorage.getItem('activeResumeId');
    const active = resumes.find(r => r.id === activeId) || resumes.find(r => r.parsed) || resumes[0];

    if (!active || !active.parsed) {
      alert('请先上传并解析一份简历');
      return;
    }

    const data = active.parseResult?.parsed_data || {};

    if (page === 'diagnosis') showDiagnosisModal(data);
    else if (page === 'jobs') showJobsModal(data);
    else if (page === 'interview') showInterviewModal(data);
    else if (page === 'tracking' || page === 'applications') showTrackingModal(data);
    else if (page === 'chat') showChatModal();
    else openModal('功能开发中', '敬请期待 ✨', '<div class="modal-empty">该功能即将上线</div>');
  }

  function openModal(title, subtitle, html) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalSubtitle').textContent = subtitle;
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('active');
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
  }
  // ESC 关闭
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // 简历诊断弹窗
  function showDiagnosisModal(data) {
    const diag = data.resume_diagnosis || {};
    const score = diag.overall_score || 0;
    const comment = diag.overall_comment || '暂无评语';
    const typos = diag.typos || [];
    const grammar = diag.grammar_issues || [];
    const redundancy = diag.redundancy || [];

    const renderItems = (items, emptyMsg) => {
      if (!items || items.length === 0) return `<div class="modal-empty" style="padding:16px">${emptyMsg}</div>`;
      return items.map(it => `
        <div class="diag-item-card">
          <div class="diag-item-orig">${it.original || ''}</div>
          <div class="diag-item-sugg">→ ${it.suggestion || ''}</div>
        </div>
      `).join('');
    };

    const html = `
      <div class="diag-score-card">
        <div class="diag-score-num">${score}</div>
        <div class="diag-score-info">
          <strong>综合评分</strong>
          <span>${comment}</span>
        </div>
      </div>
      <div class="diag-section">
        <h4>🔤 错别字（${typos.length}）</h4>
        ${renderItems(typos, '✓ 没有发现错别字')}
      </div>
      <div class="diag-section">
        <h4>✏️ 病句 / 语法（${grammar.length}）</h4>
        ${renderItems(grammar, '✓ 没有发现语法问题')}
      </div>
      <div class="diag-section">
        <h4>♻️ 语意冗杂（${redundancy.length}）</h4>
        ${renderItems(redundancy, '✓ 表达简洁')}
      </div>
    `;
    openModal('📋 简历诊断', 'AI 帮你找出问题，优化简历表达', html);
  }

  // 岗位推荐弹窗
  function showJobsModal(data) {
    const jobs = data.job_recommendations || [];
    const skills = data.extracted_skills || [];

    const skillsHtml = skills.length
      ? `<div style="margin-bottom:20px">
           <div style="font-size:13px;font-weight:700;color:var(--purple-mid);margin-bottom:8px">💼 你的技能标签</div>
           ${skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
         </div>`
      : '';

    if (jobs.length === 0) {
      openModal('🎯 岗位推荐', '基于你的简历精准匹配', skillsHtml + '<div class="modal-empty">暂无推荐岗位</div>');
      return;
    }

    const jobsHtml = jobs.map((j, idx) => {
      const s = j.salary_range || {};
      const salaryText = (s.min_salary && s.max_salary) ? `${s.min_salary}-${s.max_salary}K` : '面议';
      const city = s.city || '全国';
      const matchScore = j.match_score || (j.match_level === '高' ? 85 : 70);
      // 构造 BOSS 直聘搜索 URL
      const cityParam = (city && city !== '全国') ? `&city=${encodeURIComponent(city)}` : '';
      const bossUrl = `https://www.zhipin.com/job_detail/?query=${encodeURIComponent(j.title || '')}${cityParam}`;
      return `
        <div class="job-modal-card" onclick="window.open('${bossUrl}', '_blank')" style="cursor:pointer" title="点击跳转到 BOSS 直聘搜索">
          <div class="job-modal-head">
            <div>
              <div class="job-modal-title" style="text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color 0.2s">${j.title || '岗位'}</div>
              <div class="job-modal-industry">${j.industry || ''}</div>
            </div>
            <span class="job-modal-match">↑ ${matchScore}%</span>
          </div>
          <div class="job-modal-reason">${j.reason || ''}</div>
          <div class="job-modal-meta">
            <span class="job-modal-salary">💰 ${salaryText}</span>
            <span>📍 ${city}</span>
            <span style="margin-left:auto;color:var(--pink-primary);font-weight:600">点击搜岗位 →</span>
          </div>
        </div>
      `;
    }).join('');

    openModal('🎯 为你推荐的岗位', `共 ${jobs.length} 个匹配岗位`, skillsHtml + jobsHtml);
  }

  // 模拟面试弹窗
  function showInterviewModal(data) {
    const html = `
      <div style="text-align:center;padding:30px 20px">
        <div style="font-size:64px;margin-bottom:16px">🎤</div>
        <p style="font-size:14px;color:var(--purple-light);margin-bottom:24px">
          完整的 AI 模拟面试体验<br>包括岗位选择、JD 解析、智能提问、实时反馈
        </p>
        <button class="btn-primary" onclick="window.location.href='index-original-backup.html#interview'">
          进入面试模拟 →
        </button>
      </div>
    `;
    openModal('🎤 AI 模拟面试', '沉浸式面试练习，告别紧张', html);
  }

  // 投递追踪弹窗
  function showTrackingModal(data) {
    const html = `
      <div style="text-align:center;padding:30px 20px">
        <div style="font-size:64px;margin-bottom:16px">📊</div>
        <p style="font-size:14px;color:var(--purple-light);margin-bottom:24px">
          可视化追踪所有投递进展<br>安装 Chrome 插件可以自动同步投递记录
        </p>
        <button class="btn-primary" onclick="window.location.href='index-original-backup.html#tracking'">
          查看追踪面板 →
        </button>
      </div>
    `;
    openModal('📊 投递追踪', '不漏掉任何一个机会', html);
  }

  // 求职助手弹窗
  function showChatModal() {
    const html = `
      <div style="text-align:center;padding:30px 20px">
        <div style="font-size:64px;margin-bottom:16px">🤖</div>
        <p style="font-size:14px;color:var(--purple-light);margin-bottom:24px">
          小小求职助手<br>简历优化、面试技巧、岗位选择，都可以问我
        </p>
        <button class="btn-primary" onclick="window.location.href='index-original-backup.html#chat'">
          打开聊天 →
        </button>
      </div>
    `;
    openModal('🤖 小小·求职助手', '有任何求职问题都可以问', html);
  }

  // ========== 个人中心 ==========
  function showProfileModal() {
    const profile = JSON.parse(localStorage.getItem('userProfile') || '{}');
    const resumes = JSON.parse(localStorage.getItem('resumes') || '[]');
    const activeId = localStorage.getItem('activeResumeId');
    const nickname = profile.nickname || '用户';
    const avatar = profile.avatar || nickname[0].toUpperCase();

    // 简历列表 HTML
    const resumesHtml = resumes.length === 0
      ? `<div class="pm-empty-resume">
           还没有上传简历<br>
           <span style="font-size:11px">点击右上角「上传新简历」开始</span>
         </div>`
      : resumes.map(r => {
          const isActive = r.id === activeId;
          const time = r.uploadTime ? new Date(r.uploadTime).toLocaleDateString() : '';
          const size = r.fileSize ? (r.fileSize / 1024 / 1024).toFixed(1) + ' MB' : '';
          let badgeHtml = '';
          if (isActive) badgeHtml = '<span class="pm-resume-badge pm-badge-active">使用中</span>';
          else if (r.parsed) badgeHtml = '<span class="pm-resume-badge pm-badge-parsed">✓ 已解析</span>';
          else badgeHtml = '<span class="pm-resume-badge pm-badge-pending">待解析</span>';

          return `
            <div class="pm-resume-item ${isActive ? 'active' : ''}" onclick="setActiveResume('${r.id}')">
              <div class="pm-resume-icon">📄</div>
              <div class="pm-resume-meta">
                <div class="pm-resume-name">${r.fileName || r.name || '简历'}</div>
                <div class="pm-resume-info">
                  ${badgeHtml}
                  ${time ? `<span>${time}</span>` : ''}
                  ${size ? `<span>· ${size}</span>` : ''}
                </div>
              </div>
              <div class="pm-resume-actions">
                ${r.parsed ? `<button class="pm-icon-btn" onclick="event.stopPropagation();viewResumeDetail('${r.id}')" title="查看解析">👁</button>` : ''}
                <button class="pm-icon-btn danger" onclick="event.stopPropagation();deleteResume('${r.id}')" title="删除">🗑</button>
              </div>
            </div>
          `;
        }).join('');

    const html = `
      <div class="profile-header">
        <div class="profile-avatar-big">${avatar}</div>
        <div class="profile-info">
          <div class="profile-name">${nickname}</div>
          <div class="profile-meta">${profile.identity || '求职者'} · ${resumes.length} 份简历</div>
        </div>
        <button class="profile-edit-btn" onclick="resetProfile()">编辑资料</button>
      </div>

      <div class="pm-section-head">
        <div class="pm-section-title">📁 我的简历（最多 5 份）</div>
        <input type="file" id="pmUploadInput" accept=".pdf,.docx,.txt,.doc" style="display:none" />
        <button class="pm-upload-btn" onclick="document.getElementById('pmUploadInput').click()" ${resumes.length >= 5 ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ''}>
          📄 上传新简历
        </button>
      </div>

      <div class="pm-resume-list">
        ${resumesHtml}
      </div>
    `;
    openModal('👤 个人中心', '管理你的简历版本和个人资料', html);

    // 绑定弹窗内的上传输入
    bindUploadInput('pmUploadInput');
  }

  // 切换活跃简历
  window.setActiveResume = async function(id) {
    localStorage.setItem('activeResumeId', id);
    showProfileModal(); // 立即刷新弹窗
    updateStatusCard();
    // 同步到数据库
    try {
      const userId = await ensureUser();
      if (userId) await Api.setActiveResume(id, userId);
    } catch (e) { console.warn('[setActiveResume] DB 同步失败', e); }
  };

  // 删除简历
  window.deleteResume = async function(id) {
    if (!confirm('确定删除这份简历吗？')) return;
    let resumes = JSON.parse(localStorage.getItem('resumes') || '[]');
    resumes = resumes.filter(r => r.id !== id);
    localStorage.setItem('resumes', JSON.stringify(resumes));
    const activeId = localStorage.getItem('activeResumeId');
    if (activeId === id) {
      if (resumes.length > 0) localStorage.setItem('activeResumeId', resumes[0].id);
      else localStorage.removeItem('activeResumeId');
    }
    // 同步到数据库
    try { await Api.deleteResume(id); } catch (e) { console.warn('[deleteResume] DB 同步失败', e); }
    showProfileModal();
    updateStatusCard();
    const hasParsed = resumes.some(r => r.parsed);
    if (!hasParsed) location.reload();
  };

  // 查看某份简历的解析详情
  window.viewResumeDetail = function(id) {
    const resumes = JSON.parse(localStorage.getItem('resumes') || '[]');
    const r = resumes.find(x => x.id === id);
    if (!r || !r.parsed) {
      alert('该简历尚未解析');
      return;
    }
    // 临时切换为活跃，然后打开诊断
    localStorage.setItem('activeResumeId', id);
    showDiagnosisModal(r.parseResult?.parsed_data || {});
  };

  // 重置资料（重新走冷启动）
  window.resetProfile = function() {
    if (!confirm('编辑资料会重新进入欢迎页设置，确定继续？')) return;
    localStorage.removeItem('userProfile');
    location.reload();
  };

  async function parseResume() {
    // Trigger parse via API
    const resumes = JSON.parse(localStorage.getItem('resumes') || '[]');
    const target = resumes.find(r => !r.parsed);
    if (!target) return;
    alert('开始解析简历... (请在原版页面完成解析)');
    navigateTo('diagnosis');
  }

  // File upload handler (主页"上传简历"按钮 + 个人中心里的"上传新简历"按钮共用)
  function bindUploadInput(id) {
    document.getElementById(id)?.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      // 关闭弹窗以便看到主卡片的上传进度
      closeModal();
      await uploadAndParse(file);
      e.target.value = '';
    });
  }
  bindUploadInput('uploadInput');

  // Upload + Parse via backend API
  async function uploadAndParse(file) {
    // Validate file type
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['pdf', 'docx', 'doc', 'txt'].includes(ext)) {
      alert('只支持 PDF / DOCX / TXT 格式');
      return;
    }

    // Save placeholder to localStorage
    const resumes = JSON.parse(localStorage.getItem('resumes') || '[]');
    const resumeId = Date.now().toString();
    const newResume = {
      id: resumeId,
      name: file.name.replace(/\.[^.]+$/, ''),
      fileName: file.name,
      fileSize: file.size,
      uploadTime: Date.now(),
      parsed: false,
    };
    resumes.unshift(newResume);
    localStorage.setItem('resumes', JSON.stringify(resumes));
    localStorage.setItem('activeResumeId', resumeId);
    loadResumes();
    updateStatusCard();

    // Show parsing state
    const card = document.getElementById('statusCard');
    card.querySelector('.status-icon').textContent = '⏳';
    card.querySelector('.status-title').textContent = '正在上传并解析简历...';
    card.querySelector('.status-sub').textContent = 'AI 正在分析你的简历，约需 30 秒';
    card.querySelector('.status-actions').innerHTML = '<div style="height:8px;background:rgba(192,132,252,0.15);border-radius:4px;overflow:hidden;width:100%;max-width:300px"><div id="progressBar" style="height:100%;background:var(--gradient-btn);width:0%;transition:width 0.3s"></div></div>';

    const formData = new FormData();
    formData.append('file', file);

    try {
      const data = await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        let parsePct = 75, parseTimer;
        xhr.upload.onprogress = e => {
          if (e.lengthComputable) {
            const pct = (e.loaded / e.total) * 70;
            const bar = document.getElementById('progressBar');
            if (bar) bar.style.width = pct + '%';
          }
        };
        xhr.upload.onload = () => {
          parseTimer = setInterval(() => {
            parsePct = Math.min(95, parsePct + 1);
            const bar = document.getElementById('progressBar');
            if (bar) bar.style.width = parsePct + '%';
          }, 350);
        };
        xhr.onload = () => {
          if (parseTimer) clearInterval(parseTimer);
          try {
            const payload = JSON.parse(xhr.responseText || '{}');
            if (xhr.status < 200 || xhr.status >= 300) {
              reject(new Error(payload.detail || '请求失败'));
              return;
            }
            const bar = document.getElementById('progressBar');
            if (bar) bar.style.width = '100%';
            resolve(payload);
          } catch (e) {
            reject(new Error('服务返回格式异常'));
          }
        };
        xhr.onerror = () => {
          if (parseTimer) clearInterval(parseTimer);
          reject(new Error('网络错误，上传失败'));
        };
        xhr.timeout = 180000;
        xhr.ontimeout = () => {
          if (parseTimer) clearInterval(parseTimer);
          reject(new Error('请求超时，请稍后重试'));
        };
        xhr.open('POST', `${API_BASE_URL}/upload`);
        xhr.send(formData);
      });

      // Save parsed data
      const all = JSON.parse(localStorage.getItem('resumes') || '[]');
      const idx = all.findIndex(r => r.id === resumeId);
      if (idx >= 0) {
        all[idx].parsed = true;
        all[idx].parseResult = data;
        all[idx].rawText = data.raw_text || '';
        localStorage.setItem('resumes', JSON.stringify(all));
      }

      // 同步到数据库（如果用户已注册）
      try {
        const userId = await ensureUser();
        if (userId) {
          const created = await Api.createResume({
            user_id: userId,
            file_name: file.name,
            file_size: file.size,
            raw_text: data.raw_text || '',
            parsed_data: data.parsed_data || {},
            parse_status: 'parsed',
            is_active: false, // 后端会自动判断是否设为 active
          });
          // 用数据库的 UUID 替换前端的临时 id
          const all2 = JSON.parse(localStorage.getItem('resumes') || '[]');
          const i2 = all2.findIndex(r => r.id === resumeId);
          if (i2 >= 0 && created.id) {
            all2[i2].id = created.id;
            localStorage.setItem('resumes', JSON.stringify(all2));
            if (localStorage.getItem('activeResumeId') === resumeId) {
              localStorage.setItem('activeResumeId', created.id);
            }
          }
          await syncResumesFromDb();
        }
      } catch (e) {
        console.warn('[uploadAndParse] 数据库同步失败，仅保存到本地', e);
      }

      loadResumes();
      updateStatusCard();
    } catch (err) {
      clearInterval(autoTimer);
      alert('解析失败：' + err.message);
      // Remove the failed resume
      const all = JSON.parse(localStorage.getItem('resumes') || '[]')
        .filter(r => r.id !== resumeId);
      localStorage.setItem('resumes', JSON.stringify(all));
      loadResumes();
      updateStatusCard();
    }
  }

  // Init
  loadResumes();
  updateStatusCard();
  // 从数据库同步简历列表（异步，不阻塞首屏）
  syncResumesFromDb().then(() => {
    loadResumes();
    updateStatusCard();
  });
</script>
